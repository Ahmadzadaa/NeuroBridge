name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Cheapest checks first so a typo fails in seconds, not after a full build.
      - name: Lint
        run: npm run lint

      - name: Translation keys
        run: npm run check:i18n

      - name: Untranslated text
        run: npm run check:text

      - name: Types
        run: npm run typecheck

      # `test:coverage` runs the same suite as `test`, so running both only
      # doubled CI time.
      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    # Production runs PostgreSQL while local development runs SQLite. The seat
    # licensing lock takes a different code path on each, and only the
    # PostgreSQL one protects against overselling. Without this job the ten
    # *.integration.test.ts files skip themselves and never run anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bizsim
          POSTGRES_PASSWORD: bizsim
          POSTGRES_DB: bizsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://bizsim:bizsim@localhost:5432/bizsim_test
      DATABASE_URL: postgresql://bizsim:bizsim@localhost:5432/bizsim_test
      AUTH_SECRET: ci-test-secret-not-used-in-production-32

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate PostgreSQL schema
        run: npm run db:schema:postgres

      - name: Apply schema
        run: npx prisma db push --schema=prisma/schema.postgres.prisma --skip-generate

      - name: Generate Prisma client for PostgreSQL
        run: npx prisma generate --schema=prisma/schema.postgres.prisma

      - name: Integration tests
        run: npm run test:integration

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t bizsim-web:ci .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t bizsim-worker:ci .
