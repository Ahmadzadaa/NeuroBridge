# BizSim on a single EC2 server: Caddy (HTTPS) -> app, plus worker and Postgres.
# Managed by deploy/deploy.sh; APP_TAG in .env is the running image version.
name: bizsim

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ${IMAGE}:${APP_TAG}
    container_name: bizsim-app
    restart: unless-stopped
    env_file: app.env
    environment:
      DB_SCHEMA_SYNC: push
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ${IMAGE}-worker:${APP_TAG}
    restart: unless-stopped
    env_file: app.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizsim
      POSTGRES_DB: bizsim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizsim -d bizsim"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
