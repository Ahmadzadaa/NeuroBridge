<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BizSim">
  <!--
    Placeholder Open Graph card.

    SVG rather than a bitmap so it stays a couple of kilobytes and needs no
    build step. Some social networks will not render SVG previews, so this
    should be replaced with a 1200x630 PNG before a campaign goes out — see
    docs/landing-content-brief.md.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b5bd6"/>
      <stop offset="100%" stop-color="#3b2fa8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="220" fill="#ffffff" opacity="0.07"/>
  <circle cx="170" cy="540" r="180" fill="#ffffff" opacity="0.06"/>
  <g transform="translate(96,232)">
    <rect width="88" height="88" rx="24" fill="#ffffff"/>
    <text x="44" y="60" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="46" font-weight="700" fill="#5b5bd6" text-anchor="middle">B</text>
    <text x="120" y="42" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="60" font-weight="700" fill="#ffffff">BizSim</text>
    <text x="120" y="82" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="500" fill="#ffffff" opacity="0.85">Entrepreneurship Simulation Platform</text>
  </g>
</svg>
